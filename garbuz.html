<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хелловінська Вечірка 🎃🕷️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0b0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Верхній прихований текст */
    .continued-text {
      position: absolute;
      top: -95px;
      color: #ff7518;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 11;
      text-shadow: 0 0 10px rgba(255, 117, 24, 0.5);
    }

    .continued-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Спливаюче повідомлення */
    .secret-toast {
      position: absolute;
      top: -55px;
      background: linear-gradient(135deg, #ff7518, #ff4500);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 10px 25px rgba(255, 117, 24, 0.5);
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      z-index: 10;
    }

    .secret-toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .secret-toast:hover {
      transform: scale(1.08) translateY(0) !important;
    }

    /* Група верхніх смайликів */
    .emoji-group {
      display: none;
      gap: 20px;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .emoji-group.visible {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    .emoji-item {
      font-size: 80px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      filter: drop-shadow(0 0 15px rgba(255, 117, 24, 0.4));
    }

    .emoji-item:hover {
      transform: scale(1.15) rotate(5deg);
    }

    .emoji-item:active {
      transform: scale(0.95);
    }

    /* Пульсуючий гарбуз */
    .pumpkin-wrapper {
      position: relative;
      cursor: pointer;
      margin-bottom: 30px;
      transition: transform 0.3s ease;
      user-select: none;
    }

    .pumpkin-wrapper:hover {
      transform: scale(1.05);
    }

    .pumpkin-icon {
      font-size: 110px;
      filter: drop-shadow(0 0 25px rgba(255, 117, 24, 0.6));
      animation: pulse 1.5s infinite ease-in-out;
    }

    .click-hint {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #ff7518;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      animation: bounce 1.5s infinite;
    }

    /* Блок з повідомленням */
    .greeting-box {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      background: rgba(20, 20, 25, 0.8);
      padding: 30px 25px;
      border-radius: 20px;
      border: 1px solid rgba(255, 117, 24, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 117, 24, 0.2);
      width: 100%;
    }

    .greeting-box.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .greeting-title {
      font-size: 2.2rem;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #ff7518, #ff4500, #9b59b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .title-emoji {
      -webkit-text-fill-color: initial;
      display: inline-block;
    }

    .greeting-text {
      font-size: 1.15rem;
      color: #e0e0e0;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-card {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #ff7518, #ff4500);
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 8px 25px rgba(255, 117, 24, 0.4);
      transition: all 0.3s ease;
    }

    .btn-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(255, 117, 24, 0.7);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Додатковий текст зверху -->
    <div class="continued-text" id="continuedText">Halloween Night 2026...</div>

    <!-- Спливаючий текст -->
    <div class="secret-toast" id="secretToast">Trick or Treat! 🎃👻</div>

    <!-- Верхні смайлики (спочатку приховані) -->
    <div class="emoji-group" id="emojiGroup">
      <span class="emoji-item">👻</span>
      <span class="emoji-item">🕷️</span>
      <span class="emoji-item">🦇</span>
    </div>

    <!-- Гарбуз -->
    <div class="pumpkin-wrapper" id="pumpkinBtn">
      <div class="pumpkin-icon">🎃</div>
      <div class="click-hint" id="hintText">Торкнися гарбуза 🎃</div>
    </div>

    <!-- Привітання та кнопка -->
    <div class="greeting-box" id="greetingBox">
      <h1 class="greeting-title">Вітаємо у темряві! <span class="title-emoji">🕷️</span></h1>
      <p class="greeting-text">
        Му-хах-ха-ха, які люди з голівуду до нас завітали, нажимай на кнопку нижче і пізнавай таємниці цієї вечірки!
      </p>
      <a href="hallolysti.html" class="btn-card">Дізнатися таємниці 📜</a>
    </div>

  </div>

  <script>
    const pumpkinBtn = document.getElementById('pumpkinBtn');
    const greetingBox = document.getElementById('greetingBox');
    const hintText = document.getElementById('hintText');
    const emojiGroup = document.getElementById('emojiGroup');
    const emojis = document.querySelectorAll('.emoji-item');
    const secretToast = document.getElementById('secretToast');
    const continuedText = document.getElementById('continuedText');
    let continuedTimeout;

    // Дія при натисканні на гарбуз
    pumpkinBtn.addEventListener('click', () => {
      greetingBox.classList.add('active');
      hintText.style.display = 'none';
      document.querySelector('.pumpkin-icon').style.display = 'none';
      emojiGroup.classList.add('visible');
    });

    // Клік на смайлик показує плашку
    emojis.forEach(emoji => {
      emoji.addEventListener('click', () => {
        secretToast.classList.add('show');
      });
    });

    // При уводі курсору з плашки — вона ховається
    secretToast.addEventListener('mouseleave', () => {
      secretToast.classList.remove('show');
    });

    // Клік на плашку запускає текст на 1 секунду
    secretToast.addEventListener('click', () => {
      continuedText.classList.add('show');
      
      clearTimeout(continuedTimeout);
      continuedTimeout = setTimeout(() => {
        continuedText.classList.remove('show');
      }, 1000);
    });
  </script>

</body>
</html>
